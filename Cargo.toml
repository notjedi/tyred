[package]
name = "tyred"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
panic-halt = "1.0.0"

nrf52840-hal = "0.19.0"
nrf52840-pac = "0.12.2"
embedded-hal = "1.0.0"

usb-device = "0.3.2"
usbd-serial = "0.2.1"

[[bin]]
name = "tyred"
path = "src/main.rs"
test = false
doctest = false
bench = false