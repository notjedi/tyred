[package]
name = "tyred"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
panic-halt = "1.0.0"

embassy-nrf = { version = "0.11.0", features = ["nrf52840"] }
embassy-usb = "0.6.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }

[[bin]]
name = "tyred"
path = "src/main.rs"
test = false
doctest = false
bench = false
